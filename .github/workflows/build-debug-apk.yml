name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q dogmatix-export.zip -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission to gradlew
        run: chmod +x project/dogmatix/gradlew

      - name: Build debug APK
        working-directory: project/dogmatix
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: find project -type f -name "*.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/dogmatix/app/build/outputs/apk/debug/app-debug.apk
